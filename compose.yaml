
services:
  task-manager-backend:
    image: ${ECR_REGISTRY}/task-manager-backend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - task-manager-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  task-manager-notifications:
    image: ${ECR_REGISTRY}/task-manager-notifications:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - task-manager-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  task-manager-frontend:
    image: ${ECR_REGISTRY}/task-manager-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - task-manager-network
    depends_on:
      task-manager-backend:
        condition: service_healthy
      task-manager-notifications:
        condition: service_healthy

networks:
  task-manager-network:
    driver: bridge
