version: "3.7"

services:
  task-manager-backend:
    build:
      context: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    expose:
      - "3000"

  task-manager-frontend:
    build:
      context: ./frontend
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - task-manager-backend
